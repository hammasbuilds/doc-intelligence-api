[project]
name = "doc-intelligence-api"
version = "0.1.0"
description = "Document processing with field-level confidence routing: classify, extract, validate arithmetic, and send only the uncertain fields to a human."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["idp", "document-processing", "ocr", "invoice", "pakistan"]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.9", "jinja2>=3.1", "python-multipart>=0.0.9"]
# Test tooling. httpx2 is what starlette's TestClient imports; without it the API tests skip.
dev = ["pytest>=8.3", "ruff>=0.8", "httpx2"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docintel"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Raised inside starlette's own testclient module (anyio alias rename); not ours to fix.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
