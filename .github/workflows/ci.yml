name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # httpx2 is what starlette's TestClient needs; without it the API tests are
      # skipped rather than run, which defeats installing the api extra at all.
      - run: pip install pytest ruff httpx2
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pip install -e ".[api,dev]"
      - run: pytest -q
